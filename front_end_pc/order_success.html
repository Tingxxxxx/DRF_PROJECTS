<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美多商城-訂單提交成功</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">

    <script src="js/host.js"></script>
    <script src="js/axios-0.18.0.min.js"></script>
    <script src="js/axios-interceptor.js"></script> <!-- 自定義的 axios 攔截器 -->
    <script src="js/vue-2.5.16.js"></script>
    <script>
        var user_id = sessionStorage.user_id || localStorage.user_id;
        var access = sessionStorage.access || localStorage.access;
        if (!(user_id && access)) {
            location.href = './login.html?next=/user_center_order.html';
        }
    </script>
</head>
<body>
    <div id="app">
    <div class="header_con">
        <div class="header">
            <div class="welcome fl">歡迎來到美多商城!</div>
            <div class="fr">
                <div class="login_btn fl">
                    歡迎您：<em>{{ username }}</em>
                    <span>|</span>
                    <a @click="logout">退出</a>
                </div>
                <div class="user_link fl">
                    <span>|</span>
                    <a href="user_center_info.html">使用者中心</a>
                    <span>|</span>
                    <a href="cart.html">我的購物車</a>
                    <span>|</span>
                    <a href="user_center_order.html">我的訂單</a>
                </div>
            </div>
        </div>
    </div>

    <div class="search_bar clearfix">
        <a href="index.html" class="logo fl"><img src="images/logo.png"></a>
        <div class="sub_page_name fl">|&nbsp;&nbsp;&nbsp;&nbsp;提交訂單成功</div>
        <form method="get" action="/search.html" class="search_con fr mt40">
            <input type="text" class="input_text fl" name="q" placeholder="搜尋商品">
            <input type="submit" class="input_btn fr" name="" value="搜尋">
        </form>
    </div>

    <div class="common_list_con clearfix">
        <div class="order_success">
            <p><b>訂單提交成功，訂單總價<em>¥{{amount}}</em></b></p>
            <p>您的訂單已成功生成，請選擇您想要的支付方式，訂單號：{{order_id}}</p>
            <p><a href="/user_center_order.html">您可以在使用者中心的「我的訂單」中查看該訂單</a></p>
        </div>
    </div>

    <div class="order_submit clearfix">
        <a @click="next_operate">{{ operate }}</a>
    </div>

    <div class="footer">
        <div class="foot_link">
            <a href="#">關於我們</a>
            <span>|</span>
            <a href="#">聯絡我們</a>
            <span>|</span>
            <a href="#">招募人才</a>
            <span>|</span>
            <a href="#">友情連結</a>
        </div>
        <p>CopyRight © 美多商業股份有限公司 All Rights Reserved</p>
        <p>電話：09-****888　</p>
    </div>
    </div>
    <script src="js/order_success.js"></script>
</body>
</html>
