<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <title>美多商城-快速註冊</title>
    <link rel="stylesheet" type="text/css" href="css/reset.css">
	  <link rel="stylesheet" type="text/css" href="css/main.css">
	  <script type="text/javascript" src="js/vue-2.5.16.js"></script>
	  <script type="text/javascript" src="js/axios-0.18.0.min.js"></script>
	  <script type="text/javascript" src="js/host.js"></script>

  </head>
  <body>
    <div id="app">
      <div class="register_con">
        <div class="l_con fl">
          <a class="reg_logo"><img src="images/logo.png" /></a>
          <div class="reg_slogan">商品美 · 种类多 · 歡迎光臨</div>
          <div class="reg_banner"></div>
        </div>

        <div class="r_con fr">
          <div class="reg_title clearfix">
            <h1>快速註冊</h1>
          </div>
          <div class="reg_form clearfix">
            <form @submit.prevent="on_submit">
              <ul>
                <li>
                  <label>用戶名:</label>
                  <input type="text" v-model="username" @blur="check_username" name="user_name" id="user_name">
                  <span v-show="error_name" class="error_tip">{{ error_name_message }}</span>
                </li>
                <li>
                  <label>手機號碼:</label>
                  <input type="text" name="phone" v-model="mobile" @blur="check_phone" id="phone">
                  <span v-show="error_phone" class="error_tip">{{ error_phone_message }}</span>
                </li>
                <li>
                  <label>電子信箱：</label>
                  <input
                    type="text"
                    v-model="email"
                    v-on:blur="check_email"
                    name="email"
                    id="email"
                    placeholder="電子信箱已自動填入"
                    :disabled="email_disabled"
                  />
                  <span v-show="error_email" class="error_tip">{{ error_email_message }}</span>
                </li>
                <li class="agreement">
                  <input type="checkbox" v-model="allow" @change="check_allow" name="allow" id="allow" checked="checked">
                  <label>同意「美多商城用戶使用協議」</label>
                  <span v-show="error_allow" class="error_tip2">請勾選同意</span>
                </li>
                <li class="reg_sub">
                  <input type="submit" value="註 冊" name="">
                </li>
              </ul>				
              </form>
          </div>
        </div>
      </div>

      <div class="footer no-mp">
        <div class="foot_link">
          <a href="#">关于我们</a>
          <span>|</span>
          <a href="#">联系我们</a>
          <span>|</span>
          <a href="#">招聘人才</a>
          <span>|</span>
          <a href="#">友情链接</a>
        </div>
        <p>CopyRight © 2016 北京美多商业股份有限公司 All Rights Reserved</p>
        <p>电话：010-****888 京ICP备*******8号</p>
      </div>
    </div>

    <script type="text/javascript" src="js/quick-register.js"></script>
  </body>
</html>
