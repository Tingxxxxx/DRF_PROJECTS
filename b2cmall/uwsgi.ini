# uwsgi.ini 放在 Dockerfile 指定的啟動位置即可
# 故放在 b2cmall 專案根目錄

[uwsgi]

# 指定 uWSGI 監聽 HTTP 請求的地址和端口
# 0.0.0.0 表示接收所有網卡的請求
http = 0.0.0.0:8000

# 指定 Django 專案的 WSGI 模組和 callable
# b2cmall.wsgi 是專案的 wsgi.py，application 是 WSGI callable
module = b2cmall.wsgi:application

# 啟用 master process，管理 worker 進程，發生異常時會自動重啟 worker
master = true

# 啟動 4 個 worker process 處理請求
processes = 4

# 每個 worker 啟動 2 個線程，可提升 IO 密集型任務性能
threads = 2

# 停止 uWSGI 時自動清理 socket 或 pid 文件，避免殘留
vacuum = true

# 當收到 SIGTERM 信號（Docker stop/kill）時，uWSGI 主進程會退出
# 確保容器能正常關閉，不留下 zombie process
die-on-term = true

# 日誌檔案，uWSGI 自己的 log
logto = /app/logs/uwsgi.log

# 記錄請求詳細資訊
log-format = %(addr) - %(user) [%(ltime)] "%(method) %(uri) %(proto)" %(status) %(size) "%(referer)" "%(uagent)"